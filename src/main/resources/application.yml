server:
  port: 8080

spring:
  application:
    name: todolist-backend
  datasource:
    # 数据库连接配置，使用环境变量（${MySQL_URL}）注入，方便在不同环境下部署（环境变量后接的是默认值）
    url: "${MySQL_URL:jdbc:mysql://localhost:3306/todolist?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:210103137}
    driver-class-name: com.mysql.cj.jdbc.Driver

      # Hikari 连接池配置（针对免费主机的优化）
    hikari:
      # 连接池最大连接数（免费主机通常限制 3-10 个并发，设小一点）
      maximum-pool-size: 3
      # 最小空闲连接
      minimum-idle: 1
      # 连接超时（免费主机响应慢，设长一点）
      connection-timeout: 30000
      # 空闲连接超时
      idle-timeout: 600000
      # 连接最大存活时间
      max-lifetime: 1800000
      # 测试连接的 SQL
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        # 格式化 SQL（开发时方便看）
        format_sql: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# JWT 配置
app:
  jwt:
    # 生产环境务必改为随机长字符串（>= 32 字节），并通过环境变量注入
    secret: ${JWT_SECRET:TodoListSecretKeyChangeMeInProduction0123456789abcdef}
    # token 有效期（毫秒），默认 24 小时
    expiration: 86400000

logging:
  level:
    root: info
    com.todolist: debug
